<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor HTML</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Encabezado superior verde */
    header {
      background-color: #28a745;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background-color: #1c7c31;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    /* Editor negro */
    #editor {
      flex: 1;
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 15px;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;
      position: relative;
    }

    #editor::before {
      content: attr(data-placeholder);
      position: absolute;
      top: 15px;
      left: 15px;
      color: #555;
      font-family: 'Courier New', monospace;
      pointer-events: none;
      white-space: pre-wrap;
    }

    #editor:not(:empty)::before {
      content: "";
    }

    /* Preview blanco */
    #preview {
      flex: 1;
      border: none;
      background-color: #fff;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .panel {
        height: 50%;
      }
    }
  </style>
</head>
<body>

<header>Editor HTML</header>

<div class="container">
  <div class="panel">
    <div class="panel-header">Código</div>
    <div id="editor" contenteditable="true" data-placeholder="Ingrese aquí su código HTML..."></div>
  </div>
  <div class="panel">
    <div class="panel-header">Preview</div>
    <iframe id="preview"></iframe>
  </div>
</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');

  function updatePreview() {
    preview.srcdoc = editor.innerText;
  }

  editor.addEventListener('input', updatePreview);

  updatePreview();
</script>

</body>
</html>
