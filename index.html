<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor HTML</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Fira Code', monospace;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#0d0d0d;
  color:#a0ff9e;
}

header {
  padding:12px 20px;
  font-size:26px;
  font-weight:500;
  text-align:center;
  background:linear-gradient(90deg,#0f0,#0f0f0f);
  color:#fff;
  border-bottom:2px solid #2a2a2a;
  letter-spacing:1px;
}

#toolbar {
  display:flex;
  flex-wrap:wrap;
  background:#111111;
  padding:8px 12px;
  border-bottom:2px solid #2a2a2a;
  gap:6px;
  align-items:center;
  max-height:120px;
  overflow-y:auto;
}

#toolbar button, #toolbar select, #toolbar input[type=color] {
  background:#1f1f1f;
  border:none;
  color:#a0ff9e;
  padding:6px 10px;
  cursor:pointer;
  border-radius:6px;
  font-weight:500;
  transition:0.2s;
}

#toolbar button:hover, #toolbar select:hover, #toolbar input[type=color]:hover {
  background:#2a2a2a;
}

#toolbar label {
  font-size:14px;
  color:#a0ff9e;
  margin-left:5px;
}

#container {
  flex:1;
  display:flex;
  overflow:hidden;
}

#editor-panel {
  flex:1;
  min-width:300px;
  max-width:70%;
  cursor: ew-resize;
  display:flex;
  flex-direction:row;
  background:#0b0b0b;
  border-right:3px solid #1f1f1f;
  border-radius:0 8px 8px 0;
  box-shadow: inset 0 0 25px rgba(160,255,158,0.15);
  transition:flex 0.2s ease;
}

#line-numbers {
  background:#111111;
  color:#555;
  padding:5px 10px;
  text-align:right;
  user-select:none;
  overflow:hidden;
}

#line-numbers span {
  display:block;
  line-height:22px;
  font-size:16px;
  white-space:pre;
}

textarea {
  flex:1;
  font-family:'Fira Code', monospace;
  font-size:16px;
  line-height:22px;
  padding:8px 12px;
  border:none;
  background:#0b0b0b;
  color:#a0ff9e;
  resize:none;
  outline:none;
  caret-color:#a0ff9e;
  overflow:auto;
  white-space:pre-wrap;
  word-wrap:break-word;
}

textarea:focus {
  box-shadow: inset 0 0 20px rgba(160,255,158,0.25);
}

#preview-panel {
  flex:1;
  margin-left:12px;
  background:#f4f4f4;
  border-radius:8px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
}

#preview-panel #preview {
  flex:1;
  width:100%;
  height:100%;
  padding:12px;
  overflow:auto;
  border-radius:8px;
  background:#fff;
  outline:none;
  color:#000;
  font-family:'Roboto', sans-serif;
  font-size:16px;
  white-space:pre-wrap;
  word-wrap:break-word;
}

footer {
  padding:12px 20px;
  text-align:center;
  background:#111111;
  color:#a0ff9e;
  font-size:14px;
  border-top:2px solid #2a2a2a;
}
</style>
</head>
<body>

<header>Editor HTML</header>

<div id="toolbar">
  <!-- Texto -->
  <button onclick="format('bold')"><b>B</b></button>
  <button onclick="format('italic')"><i>I</i></button>
  <button onclick="format('underline')"><u>U</u></button>
  <button onclick="format('strikeThrough')"><s>S</s></button>
  <button onclick="format('insertOrderedList')">OL</button>
  <button onclick="format('insertUnorderedList')">UL</button>
  <button onclick="format('justifyLeft')">⬅</button>
  <button onclick="format('justifyCenter')">⬌</button>
  <button onclick="format('justifyRight')">➡</button>
  <button onclick="format('justifyFull')">⛶</button>
  <select onchange="setFontSize(this.value)">
    <option value="">Tamaño</option>
    <option value="1">10px</option>
    <option value="2">12px</option>
    <option value="3">14px</option>
    <option value="4">18px</option>
    <option value="5">24px</option>
    <option value="6">32px</option>
    <option value="7">48px</option>
  </select>
  <select onchange="setFontFamily(this.value)">
    <option value="">Fuente</option>
    <option value="Arial">Arial</option>
    <option value="Verdana">Verdana</option>
    <option value="Georgia">Georgia</option>
    <option value="Courier New">Courier New</option>
    <option value="Tahoma">Tahoma</option>
  </select>
  <!-- Colores -->
  <label>Texto:</label><input type="color" id="textColor" title="Color de texto">
  <label>Fondo:</label><input type="color" id="bgColor" title="Color de fondo">
  <!-- Elementos -->
  <button onclick="addLink()">Enlace</button>
  <button onclick="addImage()">Imagen</button>
  <button onclick="addTable()">Tabla</button>
  <button onclick="addVideo()">Video</button>
  <button onclick="addBlockquote()">Cita</button>
  <button onclick="addCodeBlock()">Código</button>
  <button onclick="addButton()">Botón</button>
  <!-- Emojis -->
  <select id="emojiPicker" onchange="insertEmoji(this.value)">
    <option value="">Emoji</option>
    <option value="😊">😊</option>
    <option value="😂">😂</option>
    <option value="😍">😍</option>
    <option value="😎">😎</option>
    <option value="👍">👍</option>
    <option value="🎉">🎉</option>
    <option value="💖">💖</option>
    <option value="🔥">🔥</option>
    <option value="💡">💡</option>
    <option value="⚡">⚡</option>
    <option value="✅">✅</option>
  </select>
</div>

<div id="container">
  <div id="editor-panel">
    <div id="line-numbers"></div>
    <textarea id="htmlInput" placeholder="Escribe tu HTML aquí..."></textarea>
  </div>
  <div id="preview-panel">
    <div id="preview" contenteditable="true"></div>
  </div>
</div>

<footer>Por Miguel Ojeda de 3ºC</footer>

<script>
const editorPanel = document.getElementById('editor-panel');
const container = document.getElementById('container');
const textarea = document.getElementById('htmlInput');
const preview = document.getElementById('preview');
const lineNumbers = document.getElementById('line-numbers');

// Colores
document.getElementById('textColor').addEventListener('input', e=>{
  document.execCommand('foreColor', false, e.target.value); updateTextarea();
});
document.getElementById('bgColor').addEventListener('input', e=>{
  document.execCommand('hiliteColor', false, e.target.value); updateTextarea();
});

// Emojis
function insertEmoji(e){ if(e) insertHTML(e); document.getElementById('emojiPicker').value=""; }

// Toolbar
function format(cmd){ document.execCommand(cmd,false,null); updateTextarea(); }

function addLink(){ const url=prompt("URL:"); if(url) document.execCommand('createLink',false,url); updateTextarea(); }
function addImage(){ const url=prompt("URL imagen:"); if(url) document.execCommand('insertImage',false,url); updateTextarea(); }
function addTable(){
  const r=parseInt(prompt("Filas:",2)), c=parseInt(prompt("Columnas:",2));
  if(isNaN(r)||isNaN(c)) return;
  let t="<table border='1' style='border-collapse:collapse;margin:5px 0;'>"; 
  for(let i=0;i<r;i++){ t+="<tr>"; for(let j=0;j<c;j++) t+="<td>&nbsp;</td>"; t+="</tr>"; } t+="</table><br>"; insertHTML(t);
}
function addVideo(){ 
  const url=prompt("URL video (YouTube/MP4):"); if(!url) return;
  let html=""; if(url.includes("youtube.com")||url.includes("youtu.be")){ 
    let id=url.split("v=")[1]||url.split("/").pop(); 
    html=`<iframe width="320" height="240" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`; 
  }else html=`<video width="320" height="240" controls><source src="${url}"></video>`;
  insertHTML(html);
}
function addBlockquote(){ insertHTML("<blockquote>Escribe aquí tu cita</blockquote><br>"); }
function addCodeBlock(){ insertHTML("<pre><code>Escribe código aquí</code></pre><br>"); }
function addButton(){
  const text=prompt("Texto del botón","Botón");
  const link=prompt("URL del botón","#");
  if(!text) return;
  const textColor=document.getElementById('textColor').value||'#000';
  const bgColor=document.getElementById('bgColor').value||'#0f0';
  insertHTML(`<a href="${link}" style="display:inline-block;padding:5px 10px;background:${bgColor};color:${textColor};border-radius:4px;text-decoration:none;">${text}</a><br>`);
}

function setFontSize(s){ if(s) document.execCommand('fontSize',false,s); updateTextarea(); }
function setFontFamily(f){ if(f) document.execCommand('fontName',false,f); updateTextarea(); }
function insertHTML(html){ document.execCommand('insertHTML',false,html); updateTextarea(); }

// Sincronización con textarea
function updateTextarea(){
  let html=preview.innerHTML.replace(/<p><br><\/p>/g,"").replace(/>\s*</g,">\n<").trim(); 
  textarea.value=html;
  updateLineNumbers();
}

// Bidireccional
textarea.addEventListener('input',()=>{ preview.innerHTML=textarea.value; updateLineNumbers(); });
preview.addEventListener('input',updateTextarea);

// Numeración de líneas
function updateLineNumbers(){
  const lines=textarea.value.split("\n").length||1;
  lineNumbers.innerHTML="";
  for(let i=1;i<=lines;i++){ const s=document.createElement("span"); s.textContent=i; lineNumbers.appendChild(s); }
}
textarea.addEventListener('scroll',()=>{ lineNumbers.scrollTop=textarea.scrollTop; });
updateLineNumbers();

// Resize editor
let isResizing=false;
editorPanel.addEventListener('mousedown',e=>{ if(e.offsetX>editorPanel.offsetWidth-10){ isResizing=true; document.body.style.cursor='ew-resize'; } });
document.addEventListener('mousemove',e=>{ if(!isResizing) return; let w=e.clientX-container.offsetLeft; if(w<300) w=300; if(w>container.offsetWidth*0.7) w=container.offsetWidth*0.7; editorPanel.style.flex=`0 0 ${w}px`; });
document.addEventListener('mouseup',()=>{ if(isResizing){ isResizing=false; document.body.style.cursor='default'; }});
</script>

</body>
</html>
