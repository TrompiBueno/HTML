<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">
    <title>Editor HTML</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/ace.js"></script>

    <style>
        body {
            margin: 0;
            background: #050505;
            color: #00ff88;
            font-family: monospace;
            overflow: hidden;
        }

        #view {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 220px;
            background: #000;
            border-right: 1px solid #00ff88;
            padding: 12px;
        }

        #title {
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            color: #00ff88;
        }

        button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            cursor: pointer;
        }

        button:hover {
            background: #00ff88;
            color: black;
        }

        #content {
            flex: 1;
            display: flex;
            height: 100vh;
        }

        #editor {
            width: 50%;
            height: 100vh;
        }

        #preview {
            width: 50%;
            height: 100vh;
            border: none;
            background: white;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            opacity: 0.6;
        }

        ::selection {
            background: #00ff88;
            color: black;
        }
    </style>
</head>

<body>

<div id="view">

    <div id="sidebar">
        <div id="title">EDITOR HTML</div>

        <button onclick="copyCode()">Copiar</button>
        <button onclick="pasteCode()">Pegar</button>
        <button onclick="runPreview()">Preview</button>

        <div class="footer">Por Miguel Ojeda</div>
    </div>

    <div id="content">
        <div id="editor"></div>
        <iframe id="preview"></iframe>
    </div>

</div>

<script>
    var editor = ace.edit("editor");
    editor.setTheme("ace/theme/monokai");
    editor.session.setMode("ace/mode/html");

    function updatePreview() {
        document.getElementById("preview").srcdoc = editor.getValue();
    }

    editor.session.on("change", updatePreview);
    updatePreview();

    function runPreview() {
        const win = window.open("", "_blank");
        win.document.open();
        win.document.write(editor.getValue());
        win.document.close();
    }

    function copyCode() {
        navigator.clipboard.writeText(editor.getValue());
    }

    async function pasteCode() {
        const text = await navigator.clipboard.readText();
        editor.setValue(text, 1);
    }

    window.onload = () => {
        editor.resize();
        updatePreview();
    };
</script>

</body>
</html>
