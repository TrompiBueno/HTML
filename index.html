<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor HTML Hacker</title>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    height:100vh;
    font-family:"Courier New", monospace;
    background:#0a0a0a;
    color:#0f0;
}

/* HEADER */
header{
    height:56px;
    background:linear-gradient(90deg,#003300,#001a00);
    position:relative;
}

header h1{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    margin:0;
    font-size:22px;
    text-shadow:0 0 8px #0f0;
}

header button{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:#0f0;
    border:none;
    padding:6px 14px;
    font-weight:bold;
    cursor:pointer;
}

/* LAYOUT */
.container{
    height:calc(100vh - 56px);
    display:flex;
}

/* PANELS */
.panel{
    width:50%;
    display:flex;
    flex-direction:column;
    border-right:2px solid #003300;
}

.panel:last-child{
    border-right:none;
}

.panel-header{
    background:#003300;
    padding:6px;
    text-align:center;
}

/* EDITOR */
.editor-wrapper{
    flex:1;
    display:flex;
    overflow:hidden;
}

#line-numbers{
    background:#001a00;
    padding:10px 6px;
    text-align:right;
    user-select:none;
}

#line-numbers div{
    height:20px;
    line-height:20px;
}

#editor{
    flex:1;
    background:#000;
    color:#0f0;
    border:none;
    outline:none;
    resize:none;
    padding:10px;
    font-family:inherit;
    font-size:14px;
    line-height:20px;
    overflow:auto;
}

/* PREVIEW */
#preview{
    flex:1;
    border:none;
    background:#fff;
}
</style>
</head>

<body>

<header>
    <h1>Editor HTML Hacker</h1>
    <button id="openPreview">Ver preview</button>
</header>

<div class="container">

    <!-- EDITOR -->
    <div class="panel">
        <div class="panel-header">Editor</div>
        <div class="editor-wrapper">
            <div id="line-numbers"></div>
            <textarea id="editor" spellcheck="false"
            placeholder="Escribe tu HTML aquí..."></textarea>
        </div>
    </div>

    <!-- PREVIEW -->
    <div class="panel">
        <div class="panel-header">Preview</div>
        <iframe id="preview"></iframe>
    </div>

</div>

<script>
const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const lineNumbers = document.getElementById("line-numbers");
const btnPreview = document.getElementById("openPreview");

/* LINE NUMBERS */
function updateLineNumbers(){
    const lines = editor.value === "" ? 1 : editor.value.split("\n").length;
    lineNumbers.innerHTML = "";
    for(let i = 1; i <= lines; i++){
        const d = document.createElement("div");
        d.textContent = i;
        lineNumbers.appendChild(d);
    }
}

/* LIVE PREVIEW */
function updatePreview(){
    preview.srcdoc = editor.value;
    updateLineNumbers();
}

editor.addEventListener("input", updatePreview);
editor.addEventListener("scroll", () => {
    lineNumbers.scrollTop = editor.scrollTop;
});

/* OPEN PREVIEW IN NEW TAB */
btnPreview.addEventListener("click", () => {
    const w = window.open();
    w.document.open();
    w.document.write(editor.value);
    w.document.close();
});

/* INIT */
updatePreview();
</script>

</body>
</html>
